<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LifeCompass</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f2f4f8;--cd:#fff;--tx:#14171f;--mu:#7b8190;--ln:#e6e9f0;--ac:#0a84ff;--ok:#2fc760;--bad:#ff4d4f;--wa:#ff9f0a;--sh:0 4px 18px rgba(20,30,60,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--cd:#171a22;--tx:#eef0f5;--mu:#8c93a3;--ln:#262a35;--sh:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d12;--cd:#171a22;--tx:#eef0f5;--mu:#8c93a3;--ln:#262a35;--sh:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,Tahoma,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
.top{max-width:640px;margin:auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700}
main{max-width:640px;margin:auto;padding:0 14px 120px}
.pg>*{animation:up .4s both}.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}
.hero{margin:12px 0;padding:18px;border-radius:22px;color:#fff;background:var(--ac);background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#8b3dff));box-shadow:var(--sh)}
.cd{background:var(--cd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.big{font-size:28px;font-weight:800;line-height:1.2}.mu{color:var(--mu);font-size:13px}.sm{font-size:13px}
input,select,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);margin:5px 0}
input:focus,textarea:focus{outline:2px solid var(--ac)}
input[type=checkbox]{width:20px;height:20px;margin:0}
button{border:0;border-radius:12px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.95)}
.bt{width:100%;margin-top:8px;padding:13px;font-weight:700}
.ch{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:99px;padding:7px 13px}
.ch.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;background:none;color:var(--tx);padding:8px 4px}
.seg button.on{background:var(--cd);font-weight:700;box-shadow:var(--sh)}
.bar{height:9px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ac);animation:gx .8s both;transform-origin:right}
.ds{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.dy{flex:1;min-width:44px;background:var(--cd);color:var(--tx);display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:14px;box-shadow:var(--sh);position:relative}
.dy.on{background:var(--ac);color:#fff}.dy small{opacity:.7}.dy u{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:currentColor}
.sw{background:var(--bad);overflow:hidden}
.sr{background:var(--cd);transition:transform .2s;touch-action:pan-y}
.t{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--ln)}
.ck{background:none;padding:0;font-size:25px;line-height:1}.ck.pop{animation:pop .35s}
.pr{width:8px;height:26px;border-radius:4px}
.rg{position:relative;display:grid;place-items:center;flex:none}.rg>b{position:absolute}
.cc{display:flex;gap:14px;align-items:center;margin:0}
.av{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--bg);border-radius:16px;flex:none}
.em{text-align:center;padding:36px 10px;color:var(--mu)}.em>div:first-child{font-size:52px}.em b{display:block;color:var(--tx)}
.bars{display:flex;gap:8px;height:120px;align-items:flex-end}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bars i{width:100%;background:var(--ac);border-radius:7px 7px 0 0;min-height:3px;animation:gr .6s both;transform-origin:bottom}
.bars small{color:var(--mu);font-size:11px}
details summary{cursor:pointer;list-style:none}details[open] summary{margin-bottom:8px}
.x{background:none;color:var(--bad);padding:4px 0}
.dot{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}.dot.on{border-color:var(--tx)}
.fab{position:fixed;left:18px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:32px;padding:0;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:20}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:20px;padding:2px 16px;border-radius:99px;transition:background .25s}
nav button.on{color:var(--ac);font-weight:700}nav button.on span{background:color-mix(in srgb,var(--ac) 16%,transparent)}
#bk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
#sh{width:100%;max-width:640px;background:var(--cd);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:sl .3s cubic-bezier(.2,.9,.3,1)}
#sh::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
#ts{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#222;color:#fff;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}
#ts.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#ts button{background:none;color:#7cc4ff;padding:0 6px}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 2s linear forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{50%{transform:scale(1.4)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}@keyframes sl{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}@keyframes gr{from{transform:scaleY(0)}}@keyframes gx{from{transform:scaleX(0)}}
@keyframes dr{from{stroke-dashoffset:var(--L)}}
</style>
</head>
<body>
<div class="top"><span>LifeCompass 🧭</span><button class="ch" data-a="sheet" data-i="s">⚙️</button></div>
<main id="app"></main>
<button class="fab" id="fb" data-a="fab">+</button>
<nav id="nav"></nav>
<div id="bk" hidden><div id="sh"></div></div>
<div id="ts"></div>
<script>
const KEY='lifecompass.v1',DS={ac:'#0a84ff',th:'auto'};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>ymd(new Date()),dt=s=>new Date(s+'T00:00:00');
let S={tasks:[],courses:[],wins:[],lessons:[],expenses:[],income:0,ceiling:0,set:{...DS}};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(S,o);S.set=Object.assign({...DS},o.set)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ui={tab:'today',hz:'daily',pf:'all',gs:'courses',rp:'week',date:TODAY(),an:1},fm={};

const $=s=>document.querySelector(s),v=i=>$('#'+i).value,num=i=>parseFloat(v(i))||0;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const n=x=>Math.round(x||0).toLocaleString('en');
const cu=(x,s='')=>`<b class="cu" data-n="${x}" data-s="${s}">${n(x)}${s}</b>`;

const PR={h:['عالية','var(--bad)'],m:['متوسطة','var(--wa)'],l:['منخفضة','var(--ac)']};
const CAT={housing:['سكن','#5e5ce6'],food:['أكل','#ff9f0a'],learning:['تعلّم','#2fc760'],fun:['ترفيه','#ff375f'],misc:['متفرقات','#8e8e93']};
const MOOD=['🤩','😎','😊','😌','😮‍💨'],DAYS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const COL=['#0a84ff','#7c3aed','#ff375f','#ff9f0a','#2fc760','#14b8a6'];

const wk=s=>{const d=dt(s||TODAY());d.setDate(d.getDate()-((d.getDay()+1)%7));const e=new Date(d);e.setDate(e.getDate()+6);return[ymd(d),ymd(e)]};
const mo=s=>{const d=dt(s||TODAY());return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))]};
const inR=(x,r)=>x>=r[0]&&x<=r[1];
const isDone=t=>t.habit?(t.days||[]).includes(ui.date):t.done;
const inHz=t=>ui.hz==='daily'?(t.date===ui.date||(t.habit&&t.date<=ui.date)):inR(t.date,ui.hz==='weekly'?wk(ui.date):mo(ui.date));
const cur=()=>S.tasks.filter(t=>t.hz===ui.hz&&inHz(t)&&(ui.pf==='all'||t.p===ui.pf)).sort((a,b)=>isDone(a)-isDone(b)||'hml'.indexOf(a.p)-'hml'.indexOf(b.p));
const streak=t=>{let c=0,d=new Date();const h=new Set(t.days||[]);if(!h.has(ymd(d)))d.setDate(d.getDate()-1);while(h.has(ymd(d))){c++;d.setDate(d.getDate()-1)}return c};
const hi=()=>{const h=new Date().getHours();return h<12?'صباح الخير':h<18?'مساء النور':'مساء الخير'};

const ring=(p,sz,c,w,tr)=>{const r=(sz-w)/2,L=2*Math.PI*r,m=sz/2;return`<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${tr||'var(--ln)'}" stroke-width="${w}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-Math.min(p,100)/100)}" style="--L:${L};animation:dr .9s ease-out"/></svg>`};
const donut=(by,sp)=>{const r=52,L=2*Math.PI*r;let a=0;return`<svg viewBox="0 0 140 140" width="170" height="170" style="transform:rotate(-90deg);animation:fd .8s">`+by.map(([k,x])=>{const l=x/sp*L,o=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${CAT[k][1]}" stroke-width="18" stroke-dasharray="${Math.max(l-2,1)} ${L}" stroke-dashoffset="${-a}"/>`;a+=l;return o}).join('')+'</svg>'};
const bars=()=>{const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ymd(d);a.push([d.getDay(),S.expenses.filter(e=>e.d===k).reduce((s,e)=>s+e.a,0)])}const m=Math.max(...a.map(x=>x[1]),1);return'<div class="bars">'+a.map(([w,x])=>`<div><small>${x?n(x):''}</small><i style="height:${x/m*80}%"></i><small>${DAYS[w]}</small></div>`).join('')+'</div>'};
const seg=(k,o,val)=>'<div class="seg">'+o.map(([a,b])=>`<button class="${a===val?'on':''}" data-a="set" data-k="${k}" data-i="${a}">${b}</button>`).join('')+'</div>';
const empty=(e,a,b)=>`<div class="em"><div>${e}</div><b>${a}</b>${b}</div>`;
const chips=(k,o,sel)=>'<div class="chs">'+o.map(([a,b])=>`<button class="ch ${a===sel?'on':''}" data-a="pick" data-k="${k}" data-i="${a}">${b}</button>`).join('')+'</div>';

/* ---------- الصفحات ---------- */
function vToday(){
  const L=cur(),d=L.filter(isDone).length,pc=L.length?Math.round(d/L.length*100):0;
  const best=Math.max(0,...S.tasks.filter(t=>t.habit).map(streak));
  const s=wk(ui.date)[0];
  const strip=ui.hz==='daily'?'<div class="ds">'+[...Array(7)].map((_,i)=>{const x=dt(s);x.setDate(x.getDate()+i);const k=ymd(x);return`<button class="dy ${k===ui.date?'on':''}" data-a="day" data-i="${k}"><small>${DAYS[x.getDay()]}</small><b>${x.getDate()}</b>${k===TODAY()?'<u></u>':''}</button>`}).join('')+'</div>':'';
  return `<div class="hero row sp"><div><div style="opacity:.85">${hi()} 👋</div><div class="big">${d} من ${L.length}</div><div style="opacity:.9">${L.length&&pc===100?'خلصت كل شي، ممتاز! 🎉':pc>=50?'قربت، كمّل!':'يلا نبدأ'}${best?` · 🔥 ${best} يوم`:''}</div></div><div class="rg">${ring(pc,86,'#fff',9,'rgba(255,255,255,.3)')}<b>${pc}%</b></div></div>
  ${seg('hz',[['daily','يومي'],['weekly','أسبوعي'],['monthly','شهري']],ui.hz)}${strip}
  <div class="chs">${[['all','الكل'],['h','⚑ عالية'],['m','متوسطة'],['l','منخفضة']].map(([a,b])=>`<button class="ch ${ui.pf===a?'on':''}" data-a="set" data-k="pf" data-i="${a}">${b}</button>`).join('')}</div>
  ${L.length?'<div class="cd" style="padding:4px 14px">'+L.map(t=>{const dn=isDone(t),k=t.habit?streak(t):0;return`<div class="sw"><div class="sr t" data-sw="tasks:${t.id}"><button class="ck ${ui.pop===t.id?'pop':''}" data-a="tg" data-i="${t.id}">${dn?'✅':'⚪'}</button><div style="flex:1;${dn?'text-decoration:line-through;opacity:.5':''}">${esc(t.title)}<div class="mu">${t.habit?'🔁 عادة'+(k?` · 🔥 ${k}`:''):t.date}</div></div><span class="pr" style="background:${PR[t.p][1]}"></span></div></div>`}).join('')+'</div>':empty('☀️','ما في مهام هون','اضغط + وأضف أول وحدة')}`;
}

function vGrowth(){
  const m=mo(),W=S.wins.filter(w=>inR(w.d,m)),Ls=S.lessons.filter(l=>inR(l.d,m)),rv=a=>a.slice().reverse();
  let h=seg('gs',[['courses','🎓 كورسات'],['wins','🏆 إنجازات'],['lessons','💡 دروس']],ui.gs);
  if(ui.gs!=='courses')h+=`<div class="cd"><div class="row sp"><b>🏆 ${W.length} إنجاز</b><b>💡 ${Ls.length} درس</b></div><div class="mu">هالشهر</div>${Ls.filter(l=>l.key).slice(-3).map(l=>`<div>• ${esc(l.key)}</div>`).join('')}</div>`;
  if(ui.gs==='courses')h+=S.courses.length?rv(S.courses).map(c=>{const p=c.total?Math.min(100,Math.round(c.done/c.total*100)):0;return`<div class="sw" style="margin:10px 0;border-radius:18px"><div class="sr cd cc" style="margin:0" data-sw="courses:${c.id}"><div class="rg">${ring(p,64,p>=100?'var(--ok)':'var(--ac)',7)}<b class="sm">${p}%</b></div><div style="flex:1"><b>${esc(c.title)}</b><div class="mu">${esc(c.prov)} · ${c.done}/${c.total} ساعة</div>${c.notes?`<div class="mu">📝 ${esc(c.notes)}</div>`:''}<div class="row" style="margin-top:8px"><button class="sm" data-a="hr" data-i="${c.id}">+1 ساعة</button><button class="ch ${c.cert?'on':''}" data-a="cert" data-i="${c.id}">🎓 شهادة</button><button class="ch" data-a="note" data-i="${c.id}">📝</button></div></div></div></div>`}).join(''):empty('🎓','ما في كورسات','أضف كورس وتابع تقدمك');
  else if(ui.gs==='wins')h+=S.wins.length?rv(S.wins).map(w=>`<div class="sw" style="margin:10px 0;border-radius:18px"><div class="sr cd cc" style="margin:0" data-sw="wins:${w.id}"><div class="av">${w.m}</div><div><b>${esc(w.t)}</b><div>${esc(w.n)}</div><div class="mu">${w.d}</div></div></div></div>`).join(''):empty('🏆','سجّل أول إنجاز','حتى الصغير بيحسب');
  else h+=S.lessons.length?rv(S.lessons).map(l=>`<details class="cd"><summary><b>${esc(l.t)}</b><div class="mu">${esc(l.key||l.d)}</div></summary>${[['غلط',l.w],['السبب',l.r],['الدرس',l.key],['الخطوة',l.nx]].filter(x=>x[1]).map(x=>`<div><span class="mu">${x[0]}:</span> ${esc(x[1])}</div>`).join('')}<div class="mu">${l.d}</div><button class="x" data-a="del" data-k="lessons" data-i="${l.id}">🗑 حذف</button></details>`).join(''):empty('💡','ما في دروس','الغلطة بتصير درس إذا سجلتها');
  return h;
}

function vBudget(){
  const m=mo(),E=S.expenses.filter(e=>inR(e.d,m)),sp=E.reduce((a,e)=>a+e.a,0),T=TODAY(),now=new Date();
  const left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
  const st=E.filter(e=>e.d===T).reduce((a,e)=>a+e.a,0),C=S.ceiling;
  const safe=Math.max(0,(C-(sp-st))/left-st),rem=C-sp,pc=C?Math.round(sp/C*100):0;
  const by=Object.keys(CAT).map(k=>[k,E.filter(e=>e.c===k).reduce((a,e)=>a+e.a,0)]).filter(x=>x[1]>0);
  return `<div class="hero row sp"><div><div style="opacity:.85">${rem<0?'تجاوزت السقف بـ':'المتبقي هالشهر'}</div><div class="big">${C?cu(Math.abs(rem)):'—'}</div><div style="opacity:.9">صرفت ${n(sp)}${C?' من '+n(C):''}</div></div><div class="rg">${ring(pc,86,pc>90?'#ffd0d0':'#fff',9,'rgba(255,255,255,.3)')}<b>${pc}%</b></div></div>
  <div class="cd row sp"><div><div class="mu">🛡️ المسموح تصرفه اليوم</div><div class="big" style="color:${safe>0?'var(--ok)':'var(--bad)'}">${C?cu(safe):'حدد السقف ⚙️'}</div></div><div class="mu">باقي ${left} يوم</div></div>
  <div class="cd"><b>آخر 7 أيام</b>${bars()}</div>
  ${by.length?`<div class="cd"><div class="rg" style="width:170px;margin:auto">${donut(by,sp)}<b>${n(sp)}</b></div>${by.map(([k,x])=>`<div class="row sp"><span style="color:${CAT[k][1]}">● ${CAT[k][0]}</span><span>${n(x)}</span></div>`).join('')}</div>`:''}
  ${E.length?'<div class="cd" style="padding:4px 14px">'+E.slice().reverse().map(e=>`<div class="sw"><div class="sr t" data-sw="expenses:${e.id}"><div class="av" style="width:40px;height:40px;font-size:20px;color:${CAT[e.c][1]}">●</div><div style="flex:1">${CAT[e.c][0]} ${esc(e.nt)}<div class="mu">${e.d}</div></div><b>${n(e.a)}</b></div></div>`).join('')+'</div>':empty('💳','ما في مصاريف','سجّل مصروفك الأول')}`;
}

function vReview(){
  const r=ui.rp==='week'?wk():mo(),T=S.tasks.filter(t=>!t.habit&&inR(t.date,r)),dn=T.filter(t=>t.done).length,rate=T.length?Math.round(dn/T.length*100):0;
  const hb=S.tasks.filter(t=>t.habit).reduce((a,t)=>a+(t.days||[]).filter(d=>inR(d,r)).length,0);
  const sp=S.expenses.filter(e=>inR(e.d,r)).reduce((a,e)=>a+e.a,0),d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const sv=(ui.rp==='month'?S.income:S.income*7/dim)-sp,W=S.wins.filter(w=>inR(w.d,r)),Ls=S.lessons.filter(l=>inR(l.d,r)&&l.key);
  return seg('rp',[['week','الأسبوع'],['month','الشهر']],ui.rp)+`<div class="hero row sp"><div><div style="opacity:.85">نسبة الإنجاز</div><div class="big">${cu(rate,'%')}</div><div style="opacity:.9">${dn} من ${T.length} مهمة · ${hb} تسجيل عادات</div></div><div class="rg">${ring(rate,86,'#fff',9,'rgba(255,255,255,.3)')}<b>🎯</b></div></div>
  <div class="cd row sp"><div><div class="mu">صرفت</div><div class="big" style="color:var(--wa)">${cu(sp)}</div></div><div style="text-align:left"><div class="mu">وفّرت${ui.rp==='week'?' (تقريبي)':''}</div><div class="big" style="color:${sv>=0?'var(--ok)':'var(--bad)'}">${cu(sv)}</div></div></div>
  <div class="cd"><b>🏆 أهم الإنجازات (${W.length})</b>${W.slice(-3).reverse().map(w=>`<div>${w.m} ${esc(w.t)}</div>`).join('')||'<div class="mu">ما في إنجازات بهالفترة</div>'}</div>
  <div class="cd"><b>💡 أهم الدروس</b>${Ls.slice(-3).reverse().map(l=>`<div>• ${esc(l.key)}${l.nx?`<div class="mu">الخطوة: ${esc(l.nx)}</div>`:''}</div>`).join('')||'<div class="mu">ما في دروس بهالفترة</div>'}</div>`;
}

/* ---------- نافذة الإضافة ---------- */
function openSheet(t){
  fm={p:'m',m:MOOD[2],c:'food'};
  const H={
    t:['مهمة جديدة',`<input id="tt" placeholder="شو بدك تعمل؟">${chips('p',Object.keys(PR).map(k=>[k,'⚑ '+PR[k][0]]),'m')}<input id="td" type="date" value="${ui.date}">${ui.hz==='daily'?'<label class="row"><input type="checkbox" id="th"> 🔁 عادة تتكرر كل يوم</label>':''}<button class="bt" data-a="addT">إضافة</button>`],
    c:['كورس جديد',`<input id="ct" placeholder="اسم الكورس"><input id="cp" placeholder="المنصة / الجهة"><input id="ch" type="number" inputmode="decimal" placeholder="عدد الساعات الكلي"><button class="bt" data-a="addC">إضافة</button>`],
    w:['إنجاز جديد 🎉',`<input id="wt" placeholder="شو أنجزت؟">${chips('m',MOOD.map(x=>[x,x]),MOOD[2])}<textarea id="wn" rows="2" placeholder="تفاصيل (اختياري)"></textarea><button class="bt" data-a="addW">سجّل الإنجاز</button>`],
    l:['درس جديد',`<input id="lt" placeholder="عنوان قصير"><textarea id="l1" rows="2" placeholder="شو اللي غلط؟"></textarea><textarea id="l2" rows="2" placeholder="السبب الجذري"></textarea><textarea id="l3" rows="2" placeholder="الدرس المستفاد"></textarea><textarea id="l4" rows="2" placeholder="الخطوة الجاية"></textarea><button class="bt" data-a="addL">حفظ</button>`],
    x:['مصروف جديد',`<input id="ba" type="number" inputmode="decimal" placeholder="المبلغ" style="font-size:26px;font-weight:700">${chips('c',Object.keys(CAT).map(k=>[k,CAT[k][0]]),'food')}<input id="bn" placeholder="ملاحظة (اختياري)"><button class="bt" data-a="addX">تسجيل</button>`],
    s:['الإعدادات',`<div class="mu">الدخل الشهري / سقف الصرف</div><div class="row"><input id="bi" type="number" inputmode="decimal" value="${S.income||''}" placeholder="الدخل"><input id="bc" type="number" inputmode="decimal" value="${S.ceiling||''}" placeholder="السقف"></div><div class="mu">اللون</div><div class="row" style="margin:6px 0">${COL.map(c=>`<button class="dot ${c===S.set.ac?'on':''}" style="background:${c}" data-a="acc" data-i="${c}"></button>`).join('')}</div><div class="mu">المظهر</div>${'<div class="chs">'+[['auto','تلقائي'],['light','فاتح'],['dark','داكن']].map(([a,b])=>`<button class="ch ${a===S.set.th?'on':''}" data-a="th" data-i="${a}">${b}</button>`).join('')+'</div>'}<div class="row"><button class="ch" data-a="exp">⬇️ نسخة احتياطية</button><label class="ch">⬆️ استيراد<input type="file" id="im" accept=".json" hidden></label></div><button class="bt" data-a="bset">حفظ</button>`]
  }[t];
  $('#sh').innerHTML=`<div class="row sp" style="margin-bottom:6px"><b style="font-size:19px">${H[0]}</b><button class="ch" data-a="cl">✕</button></div>`+H[1];
  $('#bk').hidden=false;
}
const closeSheet=()=>{$('#bk').hidden=true};

/* ---------- أدوات ---------- */
function toast(m,u){const e=$('#ts');e.innerHTML=esc(m)+(u?' <button data-a="undo">تراجع</button>':'');e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),4000)}
function conf(){for(let i=0;i<36;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},85%,60%);animation-delay:${Math.random()*.4}s;animation-duration:${1.4+Math.random()}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function theme(){const r=document.documentElement;r.style.setProperty('--ac',S.set.ac);S.set.th==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.set.th)}
const mark=b=>b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));

/* ---------- الأحداث ---------- */
function act(a,i,k,b){
  if(a==='set'){ui[k]=i;ui.an=1;if(k==='tab')scrollTo(0,0)}
  else if(a==='day')ui.date=i;
  else if(a==='fab')return openSheet(ui.tab==='today'?'t':ui.tab==='budget'?'x':{courses:'c',wins:'w',lessons:'l'}[ui.gs]);
  else if(a==='sheet')return openSheet(i);
  else if(a==='cl')return closeSheet();
  else if(a==='pick'){fm[k]=i;mark(b);return vib(10)}
  else if(a==='acc'){S.set.ac=i;theme();mark(b);return save()}
  else if(a==='th'){S.set.th=i;theme();mark(b);return save()}
  else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='lifecompass-backup.json';l.click();return}
  else if(a==='undo'){const u=ui.un;if(u){S[u.k].splice(u.idx,0,u.item);ui.un=null;$('#ts').classList.remove('on')}}
  else if(a==='del'){const x=S[k].findIndex(y=>y.id===i);if(x<0)return;ui.un={k,item:S[k][x],idx:x};S[k].splice(x,1);vib(15);toast('تم الحذف ✓',1)}
  else if(a==='tg'){const t=S.tasks.find(x=>x.id===i),D=ui.date;if(t.habit){t.days=t.days||[];t.days=t.days.includes(D)?t.days.filter(x=>x!==D):[...t.days,D]}else t.done=!t.done;ui.pop=i;vib(25);if(isDone(t)&&cur().every(isDone)){conf();vib([40,60,40,60,90])}}
  else if(a==='addT'){const t=v('tt').trim();if(!t)return;S.tasks.push({id:uid(),title:t,p:fm.p,date:v('td')||ui.date,hz:ui.hz,habit:!!($('#th')&&$('#th').checked),done:false,days:[]});closeSheet();vib(20)}
  else if(a==='addC'){const t=v('ct').trim();if(!t)return;S.courses.push({id:uid(),title:t,prov:v('cp'),total:num('ch')||10,done:0,notes:'',cert:false});closeSheet()}
  else if(a==='hr'){const c=S.courses.find(x=>x.id===i),was=c.done>=c.total;c.done+=1;if(!was&&c.done>=c.total){conf();vib([40,60,40,60,90])}else vib(20)}
  else if(a==='cert'){const c=S.courses.find(x=>x.id===i);c.cert=!c.cert}
  else if(a==='note'){const c=S.courses.find(x=>x.id===i),r=prompt('ملاحظاتك عن الكورس:',c.notes||'');if(r===null)return;c.notes=r}
  else if(a==='addW'){const t=v('wt').trim();if(!t)return;S.wins.push({id:uid(),t,m:fm.m,n:v('wn'),d:TODAY()});closeSheet();conf();vib([40,60,40,60,90])}
  else if(a==='addL'){const t=v('lt').trim();if(!t)return;S.lessons.push({id:uid(),t,w:v('l1'),r:v('l2'),key:v('l3'),nx:v('l4'),d:TODAY()});closeSheet();vib(30)}
  else if(a==='addX'){const x=num('ba');if(x<=0)return;S.expenses.push({id:uid(),a:x,c:fm.c,nt:v('bn'),d:TODAY()});closeSheet();vib(20)}
  else if(a==='bset'){S.income=num('bi');S.ceiling=num('bc');closeSheet()}
  save();render();
}
document.addEventListener('click',e=>{if(e.target.id==='bk')return closeSheet();const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i,b.dataset.k,b)});
document.addEventListener('change',e=>{if(e.target.id!=='im')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));S.set=Object.assign({...DS},S.set);save();theme();closeSheet();render();toast('تم الاستيراد ✓')}catch(x){toast('الملف غير صالح')}};r.readAsText(f)});

/* سحب الصف لحذفه */
let sx=0,sy=0,sel=null,mv=false;
document.addEventListener('touchstart',e=>{sel=e.target.closest('.sr[data-sw]');if(sel){sx=e.touches[0].clientX;sy=e.touches[0].clientY;mv=false;sel.style.transition='none'}},{passive:true});
document.addEventListener('touchmove',e=>{if(!sel)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(mv||(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))){mv=true;sel.style.transform=`translateX(${dx}px)`}},{passive:true});
document.addEventListener('touchend',e=>{if(!sel)return;const dx=e.changedTouches[0].clientX-sx,r=sel;sel=null;r.style.transition='transform .2s';if(mv&&Math.abs(dx)>110){r.style.transform=`translateX(${dx>0?'110%':'-110%'})`;const[k,i]=r.dataset.sw.split(':');setTimeout(()=>act('del',i,k),170)}else r.style.transform=''});

function render(){
  const V={today:vToday,growth:vGrowth,budget:vBudget,review:vReview},a=$('#app');
  a.className=ui.an?'pg':'';ui.an=0;a.innerHTML=V[ui.tab]();ui.pop=null;
  $('#fb').hidden=ui.tab==='review';
  $('#nav').innerHTML=[['today','📋','اليوم'],['growth','🎓','التعلّم'],['budget','💳','الميزانية'],['review','📊','المراجعة']].map(([k,i,t])=>`<button class="${k===ui.tab?'on':''}" data-a="set" data-k="tab" data-i="${k}"><span>${i}</span>${t}</button>`).join('');
  document.querySelectorAll('.cu').forEach(el=>{const t=+el.dataset.n,s0=performance.now();(function f(now){const p=Math.min((now-s0)/700,1);el.textContent=n(t*(1-Math.pow(1-p,3)))+(el.dataset.s||'');if(p<1)requestAnimationFrame(f)})(s0)});
}
theme();render();
</script>
</body>
</html>
